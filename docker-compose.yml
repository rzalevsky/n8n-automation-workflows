# Sanitised version of the compose file I run this stack with.
# Real values live in .env, which is git-ignored — see .env.example.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always

    # Host networking. n8n then reaches an LLM running on this same machine at
    # http://localhost:1234, and one on another machine at its LAN address.
    #
    # If you prefer bridge networking, replace this line with:
    #   ports:
    #     - "5678:5678"
    # and use http://host.docker.internal:1234/v1 to reach the host from
    # inside the container. Note that host.docker.internal does NOT work
    # under network_mode: host — that is a bridge-mode facility.
    network_mode: host

    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Warsaw}

      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - NODE_OPTIONS=--dns-result-order=ipv4first

      # Allows workflows to read the values below via {{ $env.NAME }}.
      # false is the n8n default; it is set explicitly here so the dependency
      # is visible rather than implied.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

      # Workflow configuration. Compose substitutes these from .env at start-up,
      # so no environment-specific value ever reaches this file.
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - INVOICE_ALERT_THRESHOLD=${INVOICE_ALERT_THRESHOLD:-500}
      - LLM_BASE_URL=${LLM_BASE_URL}

    volumes:
      # ${HOME} rather than ~ — tilde expansion in compose paths is unreliable.
      - ${HOME}/.n8n:/home/node/.n8n
